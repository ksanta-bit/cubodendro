<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CuboDendro — cubatura e dendrocronologia forestale</title>
<meta name="description" content="Applicazione di campo per la cubatura del soprassuolo, l'ipsometria con inclinometro e la dendrocronologia. I.I.S. «8 Marzo – K. Lorenz», Mirano (VE).">
<meta name="author" content="Gianluca Simonetti">
<meta name="theme-color" content="#1F4E3D">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CuboDendro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --surface-0:#f4f4f1; --surface-1:#fcfcfb; --surface-2:#eceae5;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7873;
  --line:#dedcd6; --line-strong:#c4c1b9;
  --brand:#1f4e3d; --brand-soft:#e6efe9;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --pos:#2a78d6; --neg:#e34948; --mid:#f0efec;
  --good:#1a7f4b; --warn:#a86a00; --bad:#c0392b;
  --radius:12px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#242422;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#96948b;
  --line:#33332f; --line-strong:#4a4a45;
  --brand:#7fc4a3; --brand-soft:#1d2d26;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --pos:#3987e5; --neg:#e66767; --mid:#383835;
  --good:#3fae74; --warn:#d19a2e; --bad:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--brand);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)/4) 16px;
  display:flex;align-items:center;gap:12px;position:relative;z-index:20}
html[data-theme="dark"] header{background:#16261f}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1}
header .sub{display:block;font-size:11px;font-weight:400;opacity:.85;letter-spacing:0}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;
  padding:8px 10px;font-size:14px;cursor:pointer;flex:0 0 auto;align-self:flex-start}
header .logo{flex:0 0 auto;width:40px;color:#fff;display:block}
header .logo svg{width:40px;height:auto;display:block}
header .sub.sch{opacity:.72;font-size:10.5px;margin-top:1px}
nav{display:flex;gap:2px;background:var(--surface-2);position:sticky;top:0;z-index:19;
  overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;
  padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);background:var(--surface-1)}
main{padding:14px 12px 60px;max-width:1100px;margin:0 auto}
section[hidden]{display:none}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
.card h3{font-size:14px;margin:14px 0 8px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid var(--line-strong);
  border-radius:8px;background:var(--surface-1);color:var(--text-primary);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--series-1);outline-offset:1px}
button.act{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px 16px;
  font-size:15px;font-weight:600;cursor:pointer;width:100%}
html[data-theme="dark"] button.act{background:#2c6b53;color:#fff}
button.ghost{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--line-strong);
  border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}
button.danger{background:none;color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.tile .u{font-size:11px;color:var(--text-muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
  padding:6px 6px;border-bottom:1px solid var(--line-strong);font-weight:700;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.note{font-size:12.5px;color:var(--text-secondary);background:var(--brand-soft);
  border-left:3px solid var(--brand);padding:9px 11px;border-radius:0 8px 8px 0;margin:10px 0}
.warnbox{font-size:12.5px;color:var(--text-secondary);background:var(--surface-2);
  border-left:3px solid var(--warn);padding:9px 11px;border-radius:0 8px 8px 0;margin:10px 0}
.muted{color:var(--text-muted);font-size:12.5px}
.chip{display:inline-block;background:var(--surface-2);border-radius:999px;padding:3px 10px;
  font-size:12px;font-weight:600;margin:3px 3px 0 0}
.chip button{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px;padding:0 0 0 5px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:6px 0 2px}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sig{font-weight:700}
.sig.y{color:var(--good)} .sig.n{color:var(--text-muted)}
ol.proto{padding-left:20px;margin:8px 0} ol.proto li{margin-bottom:7px}
ul.chk{list-style:none;padding:0;margin:8px 0}
ul.chk li{padding:5px 0 5px 24px;position:relative;border-bottom:1px solid var(--line)}
ul.chk li:before{content:"☐";position:absolute;left:2px;color:var(--brand);font-size:15px}
details{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:var(--surface-1)}
summary{font-weight:600;cursor:pointer;font-size:14px}
details[open] summary{margin-bottom:8px}
.eqn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);
  padding:8px 10px;border-radius:8px;display:block;margin:8px 0;overflow-x:auto;white-space:nowrap}
.big-in{font-size:24px!important;text-align:center;font-weight:700;padding:14px!important}
.angle-wrap{text-align:center;padding:14px 0 6px}
.angle-val{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  letter-spacing:-.02em;color:var(--brand)}
html[data-theme="dark"] .angle-val{color:var(--brand)}
.angle-lab{font-size:13px;color:var(--text-muted);font-weight:600;margin-top:4px}
.bubble{margin:12px 0 4px}
.bubble-track{position:relative;height:16px;background:var(--surface-2);border-radius:999px;
  border:1px solid var(--line-strong)}
.bubble-dot{position:absolute;top:1px;width:14px;height:12px;border-radius:999px;background:var(--brand);
  transform:translateX(-50%);transition:left .07s linear}
.bubble-zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line-strong);
  transform:translateX(-50%)}
.bubble-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);
  margin-top:3px;font-variant-numeric:tabular-nums}
.steps{margin-top:12px}
.step{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line-strong);
  border-radius:10px;margin-bottom:9px;background:var(--surface-1)}
.step.done{border-color:var(--brand);background:var(--brand-soft)}
.step-n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step.done .step-n{background:var(--brand);color:#fff}
.step-b{flex:1;min-width:0;font-size:13.5px}
.step-val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.step-btn{flex:0 0 auto;width:auto!important;padding:10px 15px!important;font-size:14px!important;white-space:nowrap}
.row>button{white-space:nowrap}
.result{background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;
  padding:16px;text-align:center;margin:12px 0}
.result-k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.result-v{font-size:46px;font-weight:800;color:var(--brand);line-height:1.05;margin:4px 0;
  font-variant-numeric:tabular-nums}
.result-v small{font-size:20px;font-weight:600}
.result-e{font-size:12.5px;color:var(--text-secondary)}
.credits{font-size:12.5px;color:var(--text-secondary);line-height:1.55}
.credits b{color:var(--text-primary)}
@media(max-width:520px){ .g2,.g3{grid-template-columns:1fr} header h1{font-size:15px} }
@media print{ nav,header button,button.act,button.ghost,button.danger{display:none!important}
  section[hidden]{display:block!important} .card{break-inside:avoid;page-break-inside:avoid} }
</style>
</head>

  <span class="logo"><svg viewBox="0 0 100 104" xmlns="http://www.w3.org/2000/svg" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M 0.00 104.00 L 100.00 104.00 L 100.00 0.00 L 0.00 16.00 Z M 5.20 19.90 L 94.80 7.02 L 94.80 98.80 L 5.20 98.80 Z"/><path d="M 15.00 52.00 L 45.00 52.00 L 45.00 39.25 L 41.17 37.00 L 45.00 34.75 L 45.00 22.00 L 15.00 22.00 L 15.00 34.75 L 18.82 37.00 L 15.00 39.25 Z M 21.00 28.00 L 39.00 28.00 L 39.00 33.70 L 21.00 33.70 Z M 21.00 40.30 L 39.00 40.30 L 39.00 46.00 L 21.00 46.00 Z"/><path d="M 55.00 52.00 L 61.00 52.00 L 61.00 22.00 L 55.00 22.00 Z"/><path d="M 79.00 52.00 L 85.00 52.00 L 85.00 22.00 L 79.00 22.00 Z"/><path d="M 55.00 28.00 L 85.00 28.00 L 85.00 22.00 L 55.00 22.00 Z"/><path d="M 67.00 39.40 L 73.00 39.40 L 73.00 22.00 L 67.00 22.00 Z"/><path d="M 15.00 92.00 L 21.00 92.00 L 21.00 62.00 L 15.00 62.00 Z"/><path d="M 35.71 62.00 L 23.28 77.00 L 35.71 92.00 L 43.50 92.00 L 31.07 77.00 L 43.50 62.00 Z"/><path d="M 55.00 86.00 L 61.00 86.00 L 61.00 62.00 L 55.00 62.00 Z"/><path d="M 55.00 92.00 L 85.00 92.00 L 85.00 86.00 L 55.00 86.00 Z"/></svg></span>
  <div style="flex:1;min-width:0">
    <h1>CuboDendro</h1>
    <span class="sub">Cubatura e dendrocronologia forestale · Domegge di Cadore, 18 settembre 2026</span>

  </div>
  <button id="themeBtn" title="Chiaro / scuro">◐</button>
</header>

</nav>
