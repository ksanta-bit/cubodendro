text-muted)" font-weight="700">primaverile</text><text x="270.0" y="230.0" text-anchor="middle" font-size="9.5" fill="var(--text-muted)" font-weight="700">tardivo</text></svg><figcaption><b>Che cosa si legge sulla carota.</b> L'anello sotto la corteccia è quello dell'anno in corso: da lì si procede a ritroso. Ogni anello è una coppia di bande — il <b>legno primaverile</b>, chiaro, a cellule ampie e pareti sottili, e il <b>legno tardivo</b>, scuro e denso. Il limite che l'occhio riconosce è il salto brusco fra il tardivo di un anno e il primaverile dell'anno dopo. Gli anelli si stringono verso la corteccia per pura geometria: la stessa quantità di legno si distribuisce su una circonferenza sempre più lunga.</figcaption></figure><!--/FIG-->

o</span> restano fuori e non si contano. Gli alberi in <span class="cEdge">ambra</span> sono a cavallo del confine: lì il GPS non basta e decide la cordella, misurando dal centro dell'area all'asse del fusto. Il cerchio ha il perimetro più corto a parità di superficie, quindi il minor numero di casi dubbi: è la ragione per cui in dendrometria le aree di saggio sono circolari.</figcaption></figure><!--/FIG-->
<!--FIG:pendenza--><figure class="figbox"><svg class="fig" viewBox="0 0 460 260" role="img" aria-label="Correzione della pendenza del raggio dell'area di saggio" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--text-primary)"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--series-2)"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--series-1)"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--brand)"/></marker></defs><path d="M 56 196 L 331.0 61.9 L 331.0 196 Z" fill="var(--surface-2)" opacity=".55"/><line x1="56" y1="196" x2="331.0" y2="61.9" stroke="var(--wood)" stroke-width="3.5"/><line x1="56" y1="196" x2="331.0" y2="196" stroke="var(--line-strong)" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M 106 196 A 50 50 0 0 0 100.9 174.1" fill="none" stroke="var(--amber)" stroke-width="1.8"/><text x="120.0" y="182.0" text-anchor="start" font-size="14" fill="var(--amber)" font-weight="800">α</text><line x1="56.0" y1="222.0" x2="331.0" y2="222.0" stroke="var(--text-primary)" stroke-width="1.8" marker-end="url(#ak)" marker-start="url(#ak)"/><text x="193.5" y="238.0" text-anchor="middle" font-size="11" fill="var(--text-primary)" font-weight="800">r  in proiezione orizzontale</text><line x1="38" y1="187" x2="313.0" y2="52.9" stroke="var(--series-2)" stroke-width="1.8" marker-end="url(#ao)" marker-start="url(#ao)"/><text font-size="11" fill="var(--series-2)" font-weight="800" text-anchor="middle" transform="translate(178 111) rotate(-26)">r′ = r / cos α</text><circle cx="56" cy="196" r="5.5" fill="var(--brand)"/><text x="56.0" y="180.0" text-anchor="middle" font-size="10" fill="var(--brand)" font-weight="700">centro</text><text x="230.0" y="26.0" text-anchor="middle" font-size="13" fill="var(--text-primary)" font-weight="800">26°  ·  r = 13 m  →  r′ = 14,5 m</text></svg><figcaption><b>Perché in pendenza la cordella va stesa più lunga.</b> La superficie di riferimento in dendrometria è sempre la <b>proiezione orizzontale</b>, la stessa che si usa in catasto. Su un versante inclinato, per delimitare un cerchio la cui proiezione ha raggio r bisogna stendere la cordella di r′ = r / cos α nelle direzioni di massima pendenza. Su un versante a 26° con raggio 13 m servono 14,5 m: trascurare la correzione gonfia del 10% le piante per ettaro e, con esse, la provvigione. Lungo le curve di livello la correzione non serve.</figcaption></figure><!--/FIG-->

es-1)" font-weight="800">α base</text><circle cx="66" cy="182" r="5.5" fill="var(--text-primary)"/><text x="56.0" y="172.0" text-anchor="end" font-size="10" fill="var(--text-primary)" font-weight="700">occhio</text><line x1="66.0" y1="250.0" x2="350.0" y2="250.0" stroke="var(--text-primary)" stroke-width="1.8" marker-end="url(#ak)" marker-start="url(#ak)"/><text x="208.0" y="266.0" text-anchor="middle" font-size="11" fill="var(--text-primary)" font-weight="800">D — distanza orizzontale</text><rect x="20" y="16" width="250" height="30" rx="7" fill="var(--brand)" fill-opacity=".12"/><text x="32.0" y="36.0" text-anchor="start" font-size="13" fill="var(--brand)" font-weight="800">h = D · ( tan α cima − tan α base )</text></svg><figcaption><b>Perché servono due angoli e non uno.</b> Gli angoli sono <b>con segno</b>: positivo sopra l'orizzonte, negativo sotto. Se la base dell'albero sta più in basso dei tuoi occhi, il suo contributo si somma invece di sottrarsi. Il vantaggio del doppio angolo è che <b>l'altezza a cui tieni il telefono si semplifica da sola</b>: non devi misurarla né stimarla. È il principio degli ipsometri professionali Blume-Leiss e Vertex. La distanza D va misurata in orizzontale e conviene sia almeno pari all'altezza presunta: più ti avvicini, più un errore di mezzo grado diventa metri.</figcaption></figure><!--/FIG-->
<!--FIG:gps_confine--><figure class="figbox"><svg class="fig" viewBox="0 0 380 268" role="img" aria-label="Il cerchio di incertezza del GPS a cavallo del confine" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--text-primary)"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--series-2)"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--series-1)"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--brand)"/></marker></defs><circle cx="128" cy="126" r="96" fill="var(--brand)" fill-opacity=".06" stroke="var(--brand)" stroke-width="2.4"/><text x="114.0" y="248.0" text-anchor="middle" font-size="10.5" fill="var(--brand)" font-weight="800">confine dell'area di saggio</text><circle cx="202" cy="78" r="56" fill="var(--series-1)" fill-opacity=".17" stroke="var(--series-1)" stroke-opacity=".55" stroke-dasharray="4 3"/><line x1="202" y1="78" x2="162" y2="112" stroke="var(--bad)" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="202" cy="78" r="7.5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2.4"/><circle cx="162" cy="112" r="5.5" fill="var(--bad)"/><text x="370.0" y="40.0" text-anchor="end" font-size="10.5" fill="var(--series-1)" font-weight="800">letto dal GPS</text><line x1="348.0" y1="48.0" x2="220.0" y2="62.0" stroke="var(--series-1)" stroke-width="1.4" marker-end="url(#ab)"/><text x="368.0" y="200.0" text-anchor="end" font-size="10.5" fill="var(--bad)" font-weight="800">posizione vera</text><line x1="296.0" y1="192.0" x2="172.0" y2="122.0" stroke="var(--bad)" stroke-width="1.4" marker-end="url(#ak)"/></svg><figcaption><b>Perché al confine il GPS non decide.</b> Il cerchio azzurro è l'incertezza dichiarata dal ricevitore: la posizione vera cade lì dentro con probabilità di circa il 68%, e una volta su tre sta anche più lontano. Quando quel cerchio è a cavallo del confine, il sensore non può dire da che parte sei. Sotto le chiome un telefono comune sbaglia di 5–12 m, su un raggio di 13 m: ecco perché la cordella resta lo strumento che decide, e il GPS serve a registrare il centro dell'area e a ritrovarlo, non ad aggiudicare gli alberi.</figcaption></figure><!--/FIG-->
